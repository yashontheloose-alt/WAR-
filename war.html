<body class="grid-bg"><div id="app"><div style="padding:40px;color:#cbd5e1">Loading Lockdown dashboard…</div></div><div id="modal-root"></div><div id="toast-root"></div>
<script>
(() => {
'use strict';
const STORAGE_KEY='lockdown-jee-duel-v2';
const $=s=>document.querySelector(s);
const todayKey=(date=new Date())=>`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
const offsetKey=(days)=>{let d=new Date();d.setDate(d.getDate()+days);return todayKey(d)};
const weekStart=(date=new Date())=>{let d=new Date(date);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d};
const addDays=(date,days)=>{let d=new Date(date);d.setDate(d.getDate()+days);return d};
const fmtDate=(key,opts={day:'2-digit',month:'short'})=>new Date(key+'T12:00:00').toLocaleDateString(undefined,opts);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const blankLog=()=>({minutes:0,mains:0,advanced:0,pyq:0,note:''});
const deepClone=x=>JSON.parse(JSON.stringify(x));
function emptyState(){return {names:{me:'Abhinav',friend:'Rohan'},activeProfile:'me',logs:{me:{},friend:{}},tests:{me:[],friend:[]},revealedWeeks:[],previousWinner:'No winner yet',sampleData:false,inviteCode:'DUEL-7K2Q-91'};}
function makeDemo(){
 const s=emptyState();s.sampleData=true;
 const base=weekStart();
 const mine=[245,315,280,350,300,390,185],friend=[280,290,335,300,355,310,240];
 const q1=[[32,8,12],[38,10,18],[29,12,15],[44,7,20],[35,15,18],[42,16,22],[20,8,10]];
 const q2=[[35,12,10],[30,16,14],[40,10,16],[37,14,15],[32,18,20],[39,14,16],[22,10,12]];
 for(let i=0;i<7;i++){
  const date=todayKey(addDays(base,i));
  s.logs.me[date]={minutes:mine[i],mains:q1[i][0],advanced:q1[i][1],pyq:q1[i][2],note:''};
  s.logs.friend[date]={minutes:friend[i],mains:q2[i][0],advanced:q2[i][1],pyq:q2[i][2],note:''};
  const prevDate=todayKey(addDays(base,i-7));
  s.logs.me[prevDate]={minutes:[310,270,330,285,370,400,220][i],mains:[35,30,38,34,41,44,19][i],advanced:[10,12,13,11,15,15,8][i],pyq:[14,12,16,16,20,22,10][i],note:''};
  s.logs.friend[prevDate]={minutes:[330,350,300,370,320,360,270][i],mains:[36,39,31,40,34,38,25][i],advanced:[13,15,12,16,14,14,11][i],pyq:[16,18,13,20,15,17,13][i],note:''};
 }
 const d1=todayKey(addDays(base,-4)),d2=todayKey(addDays(base,-2)),d3=todayKey(addDays(base,0));
 s.tests.me=[{id:'demo-m1',name:'Coaching Full Mock 06',p:72,c:81,m:58,total:211,date:d1},{id:'demo-m2',name:'JEE Main Pattern Test',p:78,c:75,m:64,total:217,date:d3}];
 s.tests.friend=[{id:'demo-f1',name:'Coaching Full Mock 06',p:77,c:84,m:62,total:223,date:d1},{id:'demo-f2',name:'JEE Main Pattern Test',p:69,c:82,m:71,total:222,date:d2}];
 s.previousWinner='Rohan';return s;
}
function normalize(s){let d=emptyState();if(!s||typeof s!=='object')return d;d={...d,...s};d.names={...emptyState().names,...(s.names||{})};d.logs={me:{...(s.logs?.me||{})},friend:{...(s.logs?.friend||{})}};d.tests={me:[...(s.tests?.me||[])],friend:[...(s.tests?.friend||[])]};d.revealedWeeks=[...(s.revealedWeeks||[])];return d;}
let state;
try{const raw=window.localStorage ? localStorage.getItem(STORAGE_KEY) : null;state=raw?normalize(JSON.parse(raw)):makeDemo();}catch{state=makeDemo();}
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){console.warn('Could not save locally; this browser may block file storage.',e);}}
try{if(!localStorage.getItem(STORAGE_KEY))persist();}catch{persist();}
let tab='dashboard',weekOffset=0,toastTimer=null,modal=null;
let timer={mode:'stopwatch',running:false,seconds:0,elapsed:0,interval:null,startedAt:0,profile:'me'};
let pendingSessionProfile=null;
const icons={
  swords:'⚔',dashboard:'▦',timer:'◷',layers:'▤',chart:'▥',settings:'⚙',lock:'▣',unlock:'▢',user:'●',users:'◉',trophy:'♜',clock:'◷',target:'◎',book:'▤',brain:'◈',crown:'♛',save:'✓',play:'▶',pause:'Ⅱ',stop:'■',reset:'↻',plus:'+',copy:'▢',shield:'⬡',calendar:'▦',check:'✓',close:'×',trash:'⌫',arrow:'↗',zap:'ϟ',award:'✦',flame:'♨',clipboard:'▤',lockOpen:'▢',chevronLeft:'‹',chevronRight:'›',bolt:'ϟ'
};
function icon(name,size=17){if(window.lucide){const map={dashboard:'layout-dashboard',timer:'timer',layers:'layers-3',chart:'chart-no-axes-combined',settings:'settings-2',lock:'lock-keyhole',unlock:'lock-keyhole-open',user:'user-round',users:'users-round',trophy:'trophy',clock:'clock-3',target:'target',book:'book-open',brain:'brain',crown:'crown',save:'save',play:'play',pause:'pause',stop:'square',reset:'rotate-ccw',plus:'plus',copy:'copy',shield:'shield-check',calendar:'calendar-clock',check:'check',close:'x',trash:'trash-2',arrow:'arrow-up-right',zap:'zap',award:'award',flame:'flame',clipboard:'clipboard-list',lockOpen:'lock-keyhole-open',chevronLeft:'chevron-left',chevronRight:'chevron-right',bolt:'zap'};return `<i data-lucide="${map[name]||name}" style="width:${size}px;height:${size}px;display:inline-block;flex-shrink:0"></i>`;}return `<span style="font-size:${size}px;line-height:1">${icons[name]||'•'}</span>`;}
function currentWeekKey(){return todayKey(weekStart());}
function sundayRevealTime(date=new Date()){let sun=addDays(weekStart(date),6);sun.setHours(20,0,0,0);return sun;}
function isRevealed(offset=0){if(offset<0)return true;if(offset>0)return false;return state.revealedWeeks.includes(currentWeekKey())||new Date()>=sundayRevealTime();}
function countdown(){const now=new Date(),target=sundayRevealTime();if(now>=target)return {days:0,hours:0,minutes:0,seconds:0,done:true};const ms=target-now;return {days:Math.floor(ms/86400000),hours:Math.floor(ms%86400000/3600000),minutes:Math.floor(ms%3600000/60000),seconds:Math.floor(ms%60000/1000),done:false};}
function active(){return state.activeProfile;}
function rival(){return active()==='me'?'friend':'me';}
function name(profile){return state.names[profile]||profile;}
function getLog(profile,key=todayKey()){return {...blankLog(),...(state.logs?.[profile]?.[key]||{})};}
function setLog(profile,key,changes){state.logs[profile]=state.logs[profile]||{};state.logs[profile][key]={...blankLog(),...(state.logs[profile][key]||{}),...changes};persist();}
function ensureRealDataMode(){if(state.sampleData){state.logs={me:{},friend:{}};state.tests={me:[],friend:[]};state.sampleData=false;state.previousWinner='Rohan';state.revealedWeeks=[];}}
function weekDays(offset=0){const start=addDays(weekStart(),offset*7);return Array.from({length:7},(_,i)=>{const d=addDays(start,i),key=todayKey(d);return {date:d,key,day:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i],short:fmtDate(key)};});}
function totals(profile,offset=0){return weekDays(offset).reduce((a,d)=>{const l=getLog(profile,d.key);a.minutes+=Number(l.minutes)||0;a.main+=Number(l.mains)||0;a.advanced+=Number(l.advanced)||0;a.pyq+=Number(l.pyq)||0;return a;},{minutes:0,main:0,advanced:0,pyq:0});}
function totalQuestions(t){return t.main+t.advanced+t.pyq;}
function testsInWeek(profile,offset=0){const keys=new Set(weekDays(offset).map(d=>d.key));return (state.tests[profile]||[]).filter(t=>keys.has(t.date));}
function latestTest(profile){return [...(state.tests[profile]||[])].sort((a,b)=>b.date.localeCompare(a.date))[0]||null;}
function scoreWeek(profile,offset){const t=totals(profile,offset);const mocks=testsInWeek(profile,offset).reduce((n,x)=>n+(Number(x.total)||0),0);return Math.round(t.minutes/60*10+totalQuestions(t)*.2+mocks/10);}
function previousWinner(){const a=scoreWeek('me',-1),b=scoreWeek('friend',-1);if(a===0&&b===0)return {winner:state.previousWinner||'Rohan',a,b,none:true};return {winner:a===b?'Tie':a>b?name('me'):name('friend'),a,b,none:false};}
function formatHours(min){return (min/60).toFixed(1)+'h';}
function metricCard(iconName,label,value,sub,accent='indigo'){const colors={indigo:['#818cf8','#818cf81c','#818cf83b'],violet:['#c4b5fd','#a78bfa1c','#a78bfa3b'],green:['#6ee7b7','#34d39916','#34d39938'],amber:['#fcd34d','#fbbf2416','#fbbf2438']};const c=colors[accent]||colors.indigo;return `<article class="panel metric-card"><div class="metric-head"><span class="label">${label}</span><span class="metric-icon" style="color:${c[0]};background:${c[1]};border-color:${c[2]}">${icon(iconName,18)}</span></div><div class="metric-value">${value}</div><div class="metric-sub">${sub}</div></article>`;}
function lockOverlay(){return `<div class="lock-overlay">${icon('lock',21)}<strong style="font-size:10px;letter-spacing:.14em">LOCKS OPEN SUNDAY</strong><span style="font-size:10px;color:#7e8ba0">Competitor data sealed</span></div>`;}
function legend(color,label){return `<span class="legend"><i class="dot" style="background:${color}"></i>${label}</span>`;}
function renderChart(offset=0){const days=weekDays(offset),who=active(),foe=rival(),revealed=isRevealed(offset);const mine=days.map(x=>Number(getLog(who,x.key).minutes)||0),other=days.map(x=>Number(getLog(foe,x.key).minutes)||0),max=Math.max(60,...mine,...(revealed?other:[]));const filler=[35,58,44,73,52,67,30];return `<div class="flex flex-wrap gap-4 mb-4">${legend('#818cf8',esc(name(who)))}${legend('#b19aff',revealed?esc(name(foe)):'Rival · locked')}</div><div class="chart">${days.map((d,i)=>`<div class="chart-col"><div class="chart-bars"><span class="chart-bar" title="${mine[i]} minutes" style="height:${Math.max(mine[i]?4:1,mine[i]/max*100)}%;background:linear-gradient(180deg,#a5b4fc,#6366f1)"></span><span class="chart-bar ${revealed?'':'locked-placeholder'}" title="${revealed?other[i]+' minutes':'Rival locked'}" style="height:${revealed?Math.max(other[i]?4:1,other[i]/max*100):filler[i]}%;background:linear-gradient(180deg,#d8b4fe,#8b5cf6)"></span></div><span class="chart-day">${d.day}</span><span class="chart-val">${(mine[i]/60).toFixed(1)}h</span></div>`).join('')}</div>${!revealed?`<div class="text-center subtle" style="font-size:11px;margin-top:8px">${icon('lock',13)} Rival's bars are obscured until reveal night.</div>`:''}`;}
function questionStackChart(offset=0){const days=weekDays(offset),who=active(),t=totals(who,offset),max=Math.max(10,...days.map(d=>totalQuestions({main:+getLog(who,d.key).mains||0,advanced:+getLog(who,d.key).advanced||0,pyq:+getLog(who,d.key).pyq||0})));return `<div>${days.map(d=>{const l=getLog(who,d.key),a=+l.mains||0,b=+l.advanced||0,c=+l.pyq||0,total=a+b+c;return `<div style="display:flex;align-items:center;gap:9px;margin:16px 0"><span style="width:30px;color:#8d9bb2;font-size:10px;font-weight:800">${d.day}</span><div class="bar bar-stack" style="flex:1;height:11px"><span style="width:${a/max*100}%;background:#818cf8;border-radius:9px 0 0 9px"></span><span style="width:${b/max*100}%;background:#b19aff;border-radius:0"></span><span style="width:${c/max*100}%;background:#34d399;border-radius:0 9px 9px 0"></span></div><strong style="width:32px;text-align:right;font-size:11px">${total}</strong></div>`}).join('')}</div>`;}
function weekStepper(){return `<div class="week-stepper"><button class="btn btn-secondary btn-sm" data-action="week-back" title="Previous week">${icon('chevronLeft',14)}</button><span class="tiny" style="min-width:80px;text-align:center">${weekOffset===0?'This week':weekOffset===-1?'Last week':`${Math.abs(weekOffset)} weeks ago`}</span><button class="btn btn-secondary btn-sm" data-action="week-forward" ${weekOffset===0?'disabled':''} title="Next week">${icon('chevronRight',14)}</button></div>`;}
function dashboardView(){const m=totals(active(),0),f=totals(rival(),0),qt=totalQuestions(m),today=getLog(active()),win=previousWinner(),cd=countdown(),reveal=isRevealed();const latest=latestTest(active());return `<div class="space-y-5">
 ${state.sampleData?`<div class="sample-banner">${icon('award',16)}<div><strong>Sample data is loaded for preview.</strong> These numbers are illustrative, not real performance. Switch to <b>Duel settings → Clear all data</b> to start a clean scoreboard. Entries you add will persist in this browser.</div></div>`:''}
 <section class="panel hero"><div class="hero-grid"><div><span class="pill">${icon(reveal?'unlock':'lock',13)} ${reveal?'WEEKLY REVEAL COMPLETE':'WEEKLY LOCKDOWN ACTIVE'}</span><h2 class="hero-title">Let the work stay<br><span class="gradient-text">invisible. Until Sunday.</span></h2><p class="text-muted" style="max-width:620px;line-height:1.8;font-size:13px">Log your study time, question tiers and mock scores daily. Your rival's current-week metrics stay sealed until reveal night. Compete on output, not guesses.</p><div class="flex flex-wrap gap-2" style="margin-top:20px"><button class="btn btn-primary" data-tab="study">${icon('timer',15)}Start a focus session</button><button class="btn btn-secondary" data-tab="questions">${icon('layers',15)}Log questions</button></div></div><div class="panel panel-pad count-panel" style="background:#0a1120d9"><div class="flex justify-between items-center" style="margin-bottom:16px"><span class="label">Sunday reveal countdown</span>${icon('calendar',17)}</div>${reveal?`<div style="font-size:27px;font-weight:950;color:#6ee7b7">UNLOCKED</div><p class="tiny" style="margin-top:8px">Current week results are available.</p>`:`<div class="countdown"><div class="countdown-part"><div class="countdown-num" id="cd-days">${String(cd.days).padStart(2,'0')}</div><div class="countdown-label">DAYS</div></div><div class="countdown-part"><div class="countdown-num" id="cd-hours">${String(cd.hours).padStart(2,'0')}</div><div class="countdown-label">HOURS</div></div><div class="countdown-part"><div class="countdown-num" id="cd-minutes">${String(cd.minutes).padStart(2,'0')}</div><div class="countdown-label">MINS</div></div></div><div class="tiny" style="margin-top:14px">Reveal opens Sunday at <b style="color:#dbe5f7">8:00 PM</b> local time.</div>`}<button class="btn btn-primary" style="width:100%;margin-top:17px" data-action="reveal">${icon('unlock',15)}Dev toggle: reveal early</button></div></div></section>
 <section class="grid-3">${metricCard('clock','STUDY TIME THIS WEEK',formatHours(m.minutes),`${m.minutes.toLocaleString()} focused minutes logged`,'indigo')}${metricCard('target','QUESTIONS SOLVED',qt.toLocaleString(),`${m.main} Main · ${m.advanced} Advanced · ${m.pyq} PYQs`,'violet')}${metricCard('trophy','MOCK TESTS LOGGED',(state.tests[active()]||[]).length,`Latest score: ${latest?latest.total:'—'} / 300`,'green')}</section>
 <section class="grid-main"><div class="panel panel-pad"><div class="flex items-start justify-between gap-3" style="margin-bottom:18px"><div><div class="label">Leaderboard</div><h3 class="panel-title" style="margin-top:5px">Previous week champion</h3></div><span class="status status-green">${win.none?'DEMO RESULT':'WEEK COMPLETE'}</span></div><div style="border:1px solid #29364b;background:#080e1b;border-radius:15px;padding:20px;display:flex;align-items:center;gap:15px;flex-wrap:wrap"><div style="width:57px;height:57px;border-radius:16px;display:grid;place-items:center;background:#fbbf2416;border:1px solid #fbbf2433;color:#fcd34d">${icon('trophy',28)}</div><div style="flex:1;min-width:130px"><div class="label">${win.none?'Last saved winner':'Winner by weekly activity score'}</div><div style="font-size:25px;font-weight:950;letter-spacing:-.04em;color:#fff;margin-top:4px">${esc(win.winner)}</div><div class="tiny" style="margin-top:4px">${win.none?'Placeholder winner until entries are logged.':'Study time + questions + mock scores'}</div></div><div style="text-align:right"><span class="score-badge">${win.none?'—':Math.max(win.a,win.b)+' pts'}</span><div class="tiny" style="margin-top:7px">activity score</div></div></div><div class="grid-2" style="margin-top:15px"><div style="background:#0a1120;border:1px solid #253149;border-radius:12px;padding:13px"><div class="label">${esc(name('me'))}</div><div style="font-size:20px;font-weight:900;margin-top:6px">${win.a} <span class="tiny">pts</span></div></div><div style="background:#0a1120;border:1px solid #253149;border-radius:12px;padding:13px"><div class="label">${esc(name('friend'))}</div><div style="font-size:20px;font-weight:900;margin-top:6px">${win.b} <span class="tiny">pts</span></div></div></div><p class="tiny" style="margin-top:14px">Score formula: 10 points per study hour, 0.2 per question and 0.1 per mock-test mark. Use it as a friendly progress metric, not a measure of exam readiness.</p></div>

 <section class="panel panel-pad"><div class="flex items-center justify-between flex-wrap gap-3" style="margin-bottom:18px"><div><div class="label">Study timer basis</div><h3 class="panel-title" style="margin-top:5px">Weekly study rhythm</h3></div>${weekStepper()}</div>${renderChart(weekOffset)}</section>
 <section class="grid-2"><div class="panel panel-pad"><div class="label">Tier breakdown</div><h3 class="panel-title" style="margin-top:5px;margin-bottom:15px">Questions by difficulty</h3>${questionStackChart(weekOffset)}<div class="flex flex-wrap gap-4" style="margin-top:19px">${legend('#818cf8','JEE Main')}${legend('#b19aff','JEE Advanced')}${legend('#34d399','PYQs / Elite')}</div><div style="margin-top:18px"><button class="btn btn-secondary" data-tab="questions">Open question tracker ${icon('arrow',14)}</button></div></div><div class="panel panel-pad"><div class="label">Recent mock activity</div><h3 class="panel-title" style="margin-top:5px;margin-bottom:16px">Latest result</h3>${latest?`<div style="padding:17px;border:1px solid #29364b;background:#080e1b;border-radius:13px"><div class="flex items-start justify-between gap-3"><div><div style="font-weight:850;font-size:14px">${esc(latest.name)}</div><div class="tiny" style="margin-top:5px">${fmtDate(latest.date,{day:'2-digit',month:'short',year:'numeric'})}</div></div><span class="score-badge">${latest.total}/300</span></div><div class="grid-3" style="margin-top:17px;gap:8px">${[['PHY',latest.p],['CHEM',latest.c],['MATHS',latest.m]].map(([l,v])=>`<div style="background:#111b2d;border-radius:9px;padding:10px"><div class="label">${l}</div><div style="font-weight:900;font-size:19px;margin-top:5px">${v}</div></div>`).join('')}</div></div>`:`<div class="empty">No mock result logged yet.<br><button class="btn btn-primary" style="margin-top:13px" data-tab="mocks">Log first mock</button></div>`}<button class="btn btn-secondary" style="margin-top:15px" data-tab="mocks">Open mock arena ${icon('arrow',14)}</button></div></section>
 </div>`;}
function progressLine(label,val,max,display,color){const pct=Math.max(0,Math.min(100,(Number(val)||0)/max*100));return `<div><div class="flex items-center justify-between gap-3" style="margin-bottom:8px"><span style="font-size:12px;font-weight:750;color:#c8d2e2">${label}</span><span class="tiny">${display}</span></div><div class="bar"><span style="width:${pct}%;background:${color}"></span></div></div>`;}
function studyView(){const today=getLog(active()),m=totals(active(),weekOffset),rev=isRevealed(weekOffset);return `<div class="space-y-5"><div class="grid-main"><section class="panel panel-pad" style="text-align:center"><div class="flex justify-between items-start" style="text-align:left"><div><div class="label">Focus engine</div><h3 class="panel-title" style="margin-top:5px">Session timer</h3></div><span class="status status-green" id="timer-status">READY</span></div><div class="flex justify-center gap-2" style="margin-top:23px;margin-bottom:28px"><button class="btn ${timer.mode==='stopwatch'?'btn-primary':'btn-secondary'}" data-action="timer-mode" data-mode="stopwatch">Stopwatch</button><button class="btn ${timer.mode==='pomodoro'?'btn-primary':'btn-secondary'}" data-action="timer-mode" data-mode="pomodoro">Pomodoro · 25m</button></div><div class="timer-ring" style="width:min(67vw,258px);height:min(67vw,258px);max-width:258px;max-height:258px;border-radius:50%;padding:5px;margin:auto;background:conic-gradient(from 220deg,#818cf8,#a78bfa,#26334a 77%);box-shadow:0 0 42px #6366f11a"><div style="height:100%;width:100%;border:1px solid #333d58;border-radius:50%;background:#090f1c;display:flex;align-items:center;justify-content:center;flex-direction:column"><div style="color:#a5b4fc">${icon('timer',23)}</div><div id="timer-readout" style="font-size:36px;font-weight:950;letter-spacing:-.05em;font-variant-numeric:tabular-nums;margin-top:12px">${formatTimer(timer.seconds)}</div><div class="label" id="timer-caption" style="margin-top:9px">READY WHEN YOU ARE</div></div></div><div class="flex justify-center flex-wrap gap-2" style="margin-top:25px"><button class="btn btn-primary" data-action="timer-toggle" id="timer-toggle">${icon('play',15)} Start</button><button class="btn btn-secondary" data-action="timer-stop">${icon('stop',15)} Stop & log</button><button class="btn btn-secondary" data-action="timer-reset">${icon('reset',15)} Reset</button></div><p class="tiny" style="margin-top:15px">Timer keeps running while this page is open. Stop & log adds the elapsed focus time to ${esc(name(active()))}.</p></section><section class="panel panel-pad"><div class="flex justify-between gap-3 items-start"><div><div class="label">This week</div><h3 class="panel-title" style="margin-top:5px">Daily study hours</h3></div>${weekStepper()}</div><div style="margin-top:20px">${renderChart(weekOffset)}</div><div class="grid-2" style="margin-top:21px"><div style="padding:14px;background:#080e1b;border:1px solid #27354b;border-radius:12px"><div class="label">${esc(name(active()))} total</div><div style="font-size:26px;font-weight:950;color:#a5b4fc;margin-top:6px">${formatHours(m.minutes)}</div><div class="tiny">${m.minutes} minutes logged</div></div><div class="relative" style="padding:14px;background:#080e1b;border:1px solid #27354b;border-radius:12px;overflow:hidden"><div class="label">Rival total</div>${rev?`<div style="font-size:26px;font-weight:950;color:#c4b5fd;margin-top:6px">${formatHours(totals(rival(),weekOffset).minutes)}</div><div class="tiny">${totals(rival(),weekOffset).minutes} minutes logged</div>`:`<div class="locked-placeholder" style="font-size:26px;font-weight:950;margin-top:6px">00.0h</div>${lockOverlay()}`}</div></div></section></div>
 <section class="panel panel-pad"><div class="flex items-center justify-between flex-wrap gap-3" style="margin-bottom:16px"><div><div class="label">Manual entry</div><h3 class="panel-title" style="margin-top:5px">Add study minutes</h3></div><span class="tiny">Today · ${todayKey()}</span></div><form data-form="study-manual" class="grid-2" style="align-items:end;grid-template-columns:minmax(0,1fr) auto"><label class="field-label">Minutes studied<input class="field" name="minutes" type="number" min="0" max="1440" step="1" placeholder="e.g. 90" required></label><button class="btn btn-primary" style="margin-bottom:8px">${icon('plus',14)} Add minutes</button></form><div class="danger-note">Log only focused study time. Breaks, scrolling, and solution-copying without an attempt should not count as focused work.</div></section>

function studyTable(offset){return `<div class="table-wrap"><table class="data-table"><thead><tr><th>DAY</th><th>DATE</th><th>STUDY TIME</th><th>QUESTIONS</th><th>PYQs</th><th>STATUS</th></tr></thead><tbody>${weekDays(offset).map(d=>{let l=getLog(active(),d.key),q=(+l.mains||0)+(+l.advanced||0)+(+l.pyq||0);return `<tr><td><strong>${d.day}</strong></td><td>${d.short}</td><td>${(l.minutes/60).toFixed(1)}h <span class="tiny">(${l.minutes}m)</span></td><td>${q}</td><td style="color:#6ee7b7">${l.pyq||0}</td><td>${l.minutes||q?'<span class="status status-green">LOGGED</span>':'<span class="tiny">No entry</span>'}</td></tr>`}).join('')}</tbody></table></div>`;}
function questionsView(){const today=getLog(active()),m=totals(active(),weekOffset),rev=isRevealed(weekOffset),days=weekDays(weekOffset),max=Math.max(10,...days.map(x=>totalQuestions({main:+getLog(active(),x.key).mains||0,advanced:+getLog(active(),x.key).advanced||0,pyq:+getLog(active(),x.key).pyq||0})));return `<div class="space-y-5"><div class="grid-main"><section class="panel panel-pad"><div class="label">Daily entry · ${todayKey()}</div><h3 class="panel-title" style="margin-top:5px">Question count log</h3><p class="text-muted" style="font-size:12px;line-height:1.7;margin:8px 0 19px">Count questions you genuinely attempted. Record a question in exactly one tier, and count it only once even when you revisit it.</p><form data-form="questions" class="space-y-3"><div class="tier-box"><div class="tier-head"><div class="tier-icon" style="color:#a5b4fc;background:#818cf81b;border:1px solid #818cf835">${icon('book',18)}</div><div class="tier-text"><div class="tier-title">Tier 1 · JEE Main</div><div class="tier-sub">Standard / easy-medium</div></div><input name="mains" class="field tier-input" type="number" min="0" step="1" value="${today.mains||0}" required></div></div><div class="tier-box"><div class="tier-head"><div class="tier-icon" style="color:#c4b5fd;background:#b19aff1b;border:1px solid #b19aff35">${icon('brain',18)}</div><div class="tier-text"><div class="tier-title">Tier 2 · JEE Advanced</div><div class="tier-sub">Hard / conceptual</div></div><input name="advanced" class="field tier-input" type="number" min="0" step="1" value="${today.advanced||0}" required></div></div><div class="tier-box"><div class="tier-head"><div class="tier-icon" style="color:#6ee7b7;background:#34d39917;border:1px solid #34d39935">${icon('crown',18)}</div><div class="tier-text"><div class="tier-title">Tier 3 · PYQs / Elite</div><div class="tier-sub">Timed past-year questions / papers</div></div><input name="pyq" class="field tier-input" type="number" min="0" step="1" value="${today.pyq||0}" required></div></div><label class="field-label" style="margin-top:17px">Optional topic / note<input class="field" name="note" maxlength="240" value="${esc(today.note||'')}" placeholder="e.g. Electrostatics PYQs, errors to revisit"></label><button class="btn btn-primary" style="width:100%;margin-top:9px">${icon('save',15)} Save today's breakdown</button></form><div class="grid-2" style="margin-top:16px"><div style="background:#080e1b;border:1px solid #28364c;border-radius:12px;padding:14px"><div class="label">Total today</div><div style="font-weight:950;font-size:28px;margin-top:5px">${(+today.mains||0)+(+today.advanced||0)+(+today.pyq||0)}</div></div><div style="background:#080e1b;border:1px solid #28364c;border-radius:12px;padding:14px"><div class="label">Weekly total</div><div style="font-weight:950;font-size:28px;margin-top:5px;color:#c4b5fd">${totalQuestions(m)}</div></div></div></section>
 <section class="panel panel-pad"><div class="flex items-start justify-between gap-3"><div><div class="label">Weekly breakdown</div><h3 class="panel-title" style="margin-top:5px">Stacked question volume</h3></div>${weekStepper()}</div><div style="margin-top:22px">${days.map(d=>{const l=getLog(active(),d.key),a=+l.mains||0,b=+l.advanced||0,c=+l.pyq||0;return `<div style="margin-bottom:18px"><div class="flex justify-between items-center" style="margin-bottom:8px"><span class="tiny" style="font-weight:850">${d.day} <span style="color:#58677e;margin-left:5px">${d.short}</span></span><strong style="font-size:11px">${a+b+c} q</strong></div><div class="bar bar-stack" style="height:12px"><span style="width:${a/max*100}%;background:#818cf8;border-radius:9px 0 0 9px"></span><span style="width:${b/max*100}%;background:#b19aff;border-radius:0"></span><span style="width:${c/max*100}%;background:#34d399;border-radius:0 9px 9px 0"></span></div><div class="flex gap-3" style="margin-top:6px;font-size:10px;color:#7d8aa0"><span>M ${a}</span><span>A ${b}</span><span style="color:#6ee7b7">PYQ ${c}</span></div></div>`}).join('')}</div><div class="flex flex-wrap gap-4" style="padding-top:14px;border-top:1px solid #263349">${legend('#818cf8','JEE Main')}${legend('#b19aff','JEE Advanced')}${legend('#34d399','PYQs / Elite')}</div><div class="relative" style="padding:15px;background:#080e1b;border:1px solid #28364c;border-radius:13px;margin-top:20px;overflow:hidden"><div class="label">Competitor's question volume</div>${rev?`<div style="font-size:25px;font-weight:950;margin-top:8px">${totalQuestions(totals(rival(),weekOffset))} <span class="tiny">questions</span></div><div class="tiny" style="margin-top:4px">Main ${totals(rival(),weekOffset).main} · Advanced ${totals(rival(),weekOffset).advanced} · PYQs ${totals(rival(),weekOffset).pyq}</div>`:`<div class="locked-placeholder" style="font-size:25px;font-weight:950;margin-top:8px">0000 questions</div>${lockOverlay()}`}</div></section></div>
 <section class="panel panel-pad"><div class="flex justify-between items-center gap-3 flex-wrap" style="margin-bottom:14px"><div><div class="label">Daily ledger</div><h3 class="panel-title" style="margin-top:5px">${esc(name(active()))} · question history</h3></div><span class="tiny">Week totals: ${totalQuestions(m).toLocaleString()}</span></div>${questionTable(weekOffset)}</section></div>`;}

function formatTimer(s){s=Math.max(0,Math.floor(s));return `${String(Math.floor(s/3600)).padStart(2,'0')}:${String(Math.floor(s%3600/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}

850;font-size:12px">${esc(name(active()))}</div></div><div class="profile-switch">${['me','friend'].map(who=>`<button class="profile-btn ${active()===who?'active '+who:''}" data-profile="${who}">${icon(who==='me'?'user':'users',14)}${esc(name(who))}</button>`).join('')}</div></div></header>${p.render()}</main></div>`;if(window.lucide){try{window.lucide.createIcons();}catch(err){console.warn('Lucide icons unavailable; using fallback glyphs.',err);}}}
function showToast(msg){const root=$('#toast-root');root.innerHTML=`<div class="toast">${icon('check',16)}<span>${esc(msg)}</span></div>`;if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(()=>root.innerHTML='',2800);}

function stopTimerAndAsk(){timer.running=false;if(timer.interval){clearInterval(timer.interval);timer.interval=null;}const elapsed=timer.elapsed,mins=elapsed>0?Math.max(1,Math.floor(elapsed/60)):0,profile=timer.profile||active();timer.seconds=timer.mode==='pomodoro'?1500:0;timer.elapsed=0;updateTimerUI();if(elapsed>0)showSessionModal(mins,profile);else showToast('Timer stopped before a focus minute elapsed.');}
function timerStart(){if(timer.running)return;if(timer.elapsed===0)timer.profile=active();timer.running=true;timer.startedAt=Date.now();timer.interval=setInterval(()=>{if(timer.mode==='pomodoro'){timer.seconds=Math.max(0,timer.seconds-1);timer.elapsed++;if(timer.seconds<=0){timer.running=false;clearInterval(timer.interval);timer.interval=null;const mins=Math.max(1,Math.round(timer.elapsed/60)),profile=timer.profile||active();timer.seconds=1500;timer.elapsed=0;updateTimerUI();showToast('Pomodoro complete.');showSessionModal(mins,profile);return;}}else{timer.seconds++;timer.elapsed++;}updateTimerUI();},1000);updateTimerUI();}
function timerPause(){if(!timer.running)return;timer.running=false;if(timer.interval)clearInterval(timer.interval);timer.interval=null;updateTimerUI();}
function timerReset(){timerPause();timer.seconds=timer.mode==='pomodoro'?1500:0;timer.elapsed=0;timer.profile=active();updateTimerUI();}
function setTimerMode(mode){timerPause();timer.mode=mode;timer.seconds=mode==='pomodoro'?1500:0;timer.elapsed=0;timer.profile=active();render();updateTimerUI();}

function updateMockTotal(form){const vals=['p','c','m'].map(n=>form.elements[n]?.value??'');const out=$('#mock-total');if(!out)return;if(vals.every(v=>v!==''&&Number(v)>=0&&Number(v)<=100)){out.innerHTML=`${vals.reduce((n,v)=>n+Number(v),0)}<span class="tiny"> / 300</span>`;}else out.innerHTML='—<span class="tiny"> / 300</span>';}
